# Publica la SPA de resultados_eda/interactivos, con sus figuras y conclusiones.
# La empaqueta herramientas/construir_spa.py. No publica el dataset.
name: Figuras interactivas

on:
  push:
    branches: [main]
    paths:
      - 'herramientas/construir_spa.py'
      - 'herramientas/tests/test_construir_spa.py'
      - 'ENTREGA 1/WEEK1/resultados_eda/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            herramientas/construir_spa.py
            herramientas/tests/test_construir_spa.py
            ENTREGA 1/WEEK1/resultados_eda
          sparse-checkout-cone-mode: false

      - name: Comprobar el constructor de la SPA
        run: python3 -m unittest discover -s herramientas/tests -p test_construir_spa.py

      - name: Montar la SPA
        run: |
          python3 herramientas/construir_spa.py _site
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
