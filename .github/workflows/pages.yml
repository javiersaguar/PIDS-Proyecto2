# Publica en GitHub Pages la web de figuras interactivas de la memoria.
# La monta herramientas/construir_web.py con web/index.html, las figuras del EDA y los
# resultados del entrenamiento. No publica el dataset.
name: Figuras interactivas

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'herramientas/construir_web.py'
      - 'ENTREGA 1/WEEK1/resultados_eda/**'
      - 'ENTREGA 1/WEEK2/resultados_train/**'
      - 'ENTREGA 1/WEEK2/resultados_test/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web
            herramientas/construir_web.py
            ENTREGA 1/WEEK1/resultados_eda
            ENTREGA 1/WEEK2/resultados_train
            ENTREGA 1/WEEK2/resultados_test
          sparse-checkout-cone-mode: false

      - name: Montar la web
        run: |
          python3 herramientas/construir_web.py _site
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
